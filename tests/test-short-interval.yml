name: Test short interval - no new commits expected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          seconds: "1"
      - name: Assert action ran with short interval or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          HAS_NEW_COMMITS: ${{ steps.action.outputs.has-new-commits }}
          NEW_COMMITS_NUMBER: ${{ steps.action.outputs.new-commits-number }}
        run: |
          echo "outcome: $OUTCOME"
          echo "has-new-commits: $HAS_NEW_COMMITS"
          echo "new-commits-number: $NEW_COMMITS_NUMBER"
          if [ "$OUTCOME" = "success" ]; then
            # With a 1-second interval, we expect no new commits
            if [ -z "$HAS_NEW_COMMITS" ]; then
              echo "FAIL: has-new-commits output is empty"
              exit 1
            fi
            if [ "$HAS_NEW_COMMITS" != "true" ] && [ "$HAS_NEW_COMMITS" != "false" ]; then
              echo "FAIL: has-new-commits should be 'true' or 'false', got '$HAS_NEW_COMMITS'"
              exit 1
            fi
            if [ -z "$NEW_COMMITS_NUMBER" ]; then
              echo "FAIL: new-commits-number output is empty"
              exit 1
            fi
            # With 1 second interval, we strongly expect 0 new commits
            if [ "$HAS_NEW_COMMITS" = "false" ] && [ "$NEW_COMMITS_NUMBER" = "0" ]; then
              echo "PASS: no new commits found in 1-second window as expected"
            else
              echo "PASS: action succeeded with has-new-commits=$HAS_NEW_COMMITS, new-commits-number=$NEW_COMMITS_NUMBER"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
