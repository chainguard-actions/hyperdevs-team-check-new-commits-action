name: Test custom branch - check new commits on specific branch
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          seconds: "86400"
          branch: "main"
      - name: Assert action ran with custom branch or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          HAS_NEW_COMMITS: ${{ steps.action.outputs.has-new-commits }}
          NEW_COMMITS_NUMBER: ${{ steps.action.outputs.new-commits-number }}
        run: |
          echo "outcome: $OUTCOME"
          echo "has-new-commits: $HAS_NEW_COMMITS"
          echo "new-commits-number: $NEW_COMMITS_NUMBER"
          if [ "$OUTCOME" = "success" ]; then
            # Validate outputs are set and have expected boolean/numeric values
            if [ -z "$HAS_NEW_COMMITS" ]; then
              echo "FAIL: has-new-commits output is empty"
              exit 1
            fi
            if [ "$HAS_NEW_COMMITS" != "true" ] && [ "$HAS_NEW_COMMITS" != "false" ]; then
              echo "FAIL: has-new-commits should be 'true' or 'false', got '$HAS_NEW_COMMITS'"
              exit 1
            fi
            if [ -z "$NEW_COMMITS_NUMBER" ]; then
              echo "FAIL: new-commits-number output is empty"
              exit 1
            fi
            # Validate new-commits-number is a non-negative integer
            if ! echo "$NEW_COMMITS_NUMBER" | grep -qE '^[0-9]+$'; then
              echo "FAIL: new-commits-number should be a non-negative integer, got '$NEW_COMMITS_NUMBER'"
              exit 1
            fi
            echo "PASS: action succeeded with branch=main, has-new-commits=$HAS_NEW_COMMITS, new-commits-number=$NEW_COMMITS_NUMBER"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
