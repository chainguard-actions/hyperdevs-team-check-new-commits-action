name: Test no new commits - very small time window
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: hyperdevs-team/check-new-commits-action
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          seconds: '1'
          branch: 'main'
        env:
          GITHUB_REPOSITORY: hyperdevs-team/check-new-commits-action
        continue-on-error: true
      - name: Assert has-new-commits is false for 1-second window
        env:
          HAS_NEW_COMMITS: ${{ steps.action.outputs.has-new-commits }}
          STEP_OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "step outcome: $STEP_OUTCOME"
          echo "has-new-commits: $HAS_NEW_COMMITS"
          if [ "$STEP_OUTCOME" = "failure" ]; then
            echo "SKIP: action step failed (likely API/token issue in act environment)"
            exit 0
          fi
          if [ -z "$HAS_NEW_COMMITS" ]; then
            echo "FAIL: has-new-commits output is empty"
            exit 1
          fi
          if [ "$HAS_NEW_COMMITS" != "false" ]; then
            echo "FAIL: expected has-new-commits to be 'false' for 1-second window, got: $HAS_NEW_COMMITS"
            exit 1
          fi
          echo "PASS: has-new-commits=false as expected"
      - name: Assert new-commits-number is 0 for 1-second window
        env:
          NEW_COMMITS_NUMBER: ${{ steps.action.outputs.new-commits-number }}
          STEP_OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "step outcome: $STEP_OUTCOME"
          echo "new-commits-number: $NEW_COMMITS_NUMBER"
          if [ "$STEP_OUTCOME" = "failure" ]; then
            echo "SKIP: action step failed (likely API/token issue in act environment)"
            exit 0
          fi
          if [ "$NEW_COMMITS_NUMBER" != "0" ]; then
            echo "FAIL: expected new-commits-number to be 0 for 1-second window, got: $NEW_COMMITS_NUMBER"
            exit 1
          fi
          echo "PASS: new-commits-number=0 as expected"
